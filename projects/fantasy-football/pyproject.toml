[project]
name = "ffdraft"
version = "0.1.0"
description = "Fantasy football draft-prep pipeline with custom scoring and multi-source projections"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "nflreadpy>=0.1.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "duckdb>=0.9.0",
    "rich>=13.5.0",
    "typer>=0.9.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    # numpy and scipy already arrive transitively via scikit-learn/lightgbm,
    # but model/calibrate.py imports both directly (feature matrices,
    # scipy.stats.spearmanr) so they are declared explicitly.
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.scripts]
ffdraft = "ffdraft.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.0",
]
